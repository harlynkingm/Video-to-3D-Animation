name: CI

on: [push]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: main

      - name: Ensure pixi env is installed (explicit)
        shell: pwsh
        run: |
          Write-Host "=== pixi version ==="
          & "$env:USERPROFILE\.pixi\bin\pixi.exe" --version || pixi --version
          Write-Host "Running: pixi install (uses pixi.toml / pixi.lock)"
          pixi install -e main --locked

      - name: Pixi environment diagnostics
        shell: pwsh
        run: |
          Write-Host "=== Python version inside pixi environment ==="
          pixi run -e main python -V

          Write-Host "=== pip list inside pixi environment ==="
          pixi run -e main pip list

      - name: Torch import sanity check (isolated)
        shell: pwsh
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          Write-Host "=== Importing torch in isolation, before any test collection ==="
          pixi run -e main python -u -c "print('importing torch...'); import torch; print('torch imported OK:', torch.__version__); print('cuda available:', torch.cuda.is_available())"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Bare torch import/cuda-check failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Run tests
        shell: pwsh
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          Write-Host "=== Running pytest ==="
          # Unbuffered + faulthandler so that if this crashes natively again,
          # whatever ran before the crash is actually visible in the log
          # instead of lost in an unflushed stdout buffer.
          pixi run -e main python -u -m pytest tests/ -vv --tb=short
          if ($LASTEXITCODE -ne 0) {
            Write-Host "pytest failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Run UI tests
        shell: pwsh
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          Write-Host "=== Running pytest (ui/tests) ==="
          # Same main env -- PySide6 is already a main-env dependency, and
          # ui/tests only covers Qt-free pure logic (Qt-dependent behavior
          # is verified manually/offscreen, not via pytest), so no display
          # or extra environment is needed here.
          pixi run -e main python -u -m pytest ui/tests -vv --tb=short
          if ($LASTEXITCODE -ne 0) {
            Write-Host "UI tests failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
