[workspace]
authors = ["Max Harlynking <harlynkingm@gmail.com>"]
channels = ["conda-forge", "pozzettiandrea"]
name = "Video-to-3D-Animation"
platforms = ["win-64"]
version = "0.1.0"

[tasks]

# Runs the full suite across both environments, most stages' tests live in
# `main`, but stage 10's own tests (tests/test_stage_10_export.py) need bpy
# and only run under `export`. Every other test module imports torch/cv2/
# etc. at its own top level (unguarded), so `export` must target stage 10's
# file specifically, collecting the whole `tests/` dir under that env errors
# out before running anything. Chained with `;`, not `&&`, so a failure in one
# environment doesn't hide the other environment's results.
#
# The export half goes through scripts/run_export_tests.py, not a direct
# `pytest` invocation: bpy has a reproducible access-violation crash during
# its own interpreter teardown on Windows, well after every test has already
# finished and passed, a raw `pytest` call here would make that benign
# crash look like the whole suite failed (segfault, nonzero exit) even when
# every test genuinely passed. The wrapper isolates that crash to a child
# process and reports the real result from its junit report instead.
[tasks.test]
cmd = "pixi run -e main python -m pytest tests/; pixi run -e export python scripts/run_export_tests.py; pixi run -e main python -m pytest ui/tests"

# Launches the minimal desktop UI (ui/) that composes and runs a `pipeline.run`
# invocation instead of using the CLI by hand. Runs under the same `main` env
# as the pipeline itself, see ui/pipeline_runner.py.
[tasks.ui]
cmd = "pixi run -e main python -m ui"

# Static dead-code scan (vulture), checks pipeline/ for functions/classes/
# attributes with no reference anywhere, including tests/ and scripts/ (passed
# too, so cross-file usage from a test counts). `.vulture_whitelist.py` records
# confirmed false positives (dynamic dispatch vulture's static analysis can't
# see, CLI entrypoints invoked via subprocess, dataclass fields read through
# `dataclasses.fields()`, etc.) so re-runs don't re-flag them.
[tasks.deadcode]
cmd = "pixi run -e main python -m vulture pipeline/ tests/ scripts/ .vulture_whitelist.py --min-confidence 70"

[dependencies]

# export: the final export pipeline stage (writes output.blend). Isolated in
# its own environment because bpy pins Python tightly to its own release,
# independent of the rest of the ML stack. Sourced from the pozzettiandrea
# conda channel (not PyPI's bpy package) because it's already proven working
# on Python 3.13 via ComfyUI Desktop's own pixi-managed environments on this
# machine.
[feature.export.dependencies]
python = "3.13.*"
pytest = ">=7.0"
scipy = "*"
tqdm = ">=4.60.0"

[feature.export.dependencies.bpy]
version = "*"
channel = "pozzettiandrea"

[environments.export]
features = ["export"]
no-default-feature = true

# main: the shared environment for most pipeline stages (GVHMR, SAM 3.1, etc.).
# Trimmed relative to ComfyUI-MotionCapture's own declared deps: no hydra-core/
# hydra-zen/hydra-colorlog (never actually imported in its code), no
# torch_scatter/dpvo_cuda (DPVO-only, and DPVO is skipped for this project's
# static-camera-only scope), no pycolmap (moving-camera VO only), no pytorch3d
# (replaced by a portable pure-PyTorch shim).
[feature.main.dependencies]
python = "3.13.*"

[feature.main.pypi-dependencies]
# depth-anything-3 (below) unconditionally declares open3d as a PyPI
# dependency, even though nothing in its actual source imports it (confirmed
# by searching its real repo), but PyPI has no cp313 wheel for open3d at
# all, which would otherwise break resolution outright. A first attempt
# pulled real open3d in via conda-forge (which does have a py313 win-64
# build), but that silently swapped in a conda-built numpy/BLAS stack that
# conflicts with torch's own bundled OpenMP runtime, a real, confirmed
# crash (`OMP: Error #15`, a hard `Fatal Python error: Aborted`) during
# stage 2 (GVHMR). Fixed instead with a tiny local stub package
# (vendor/open3d_stub/) that satisfies the declared dependency without
# installing anything real, safe specifically because nothing ever calls
# `import open3d` in the code paths this project's adapter exercises.
open3d = { path = "vendor/open3d_stub", editable = true }
smplx = ">=0.1.28"
timm = ">=0.9.0"
einops = ">=0.6.0"
roma = ">=1.3.0"
trimesh = ">=3.20.0"
scipy = "*"
scikit-image = ">=0.19.0"
opencv-python-headless = ">=4.8.0"
safetensors = "*"
huggingface-hub = ">=0.16.0"
transformers = ">=4.40.0"
pytest = ">=7.0"
vulture = ">=2.11"
# Was already pulled in transitively by transformers; declared explicitly since
# stage 1/2/4's own per-frame progress bars (pipeline/helpers/progress_reporter.py)
# now import it directly, not just as an incidental dependency of another package.
tqdm = ">=4.60.0"
depth-anything-3 = ">=0.1.1"
# depth-anything-3's own model code imports addict directly (depth_anything_3/model/da3.py)
# but its pyproject.toml never declares it, a real gap in the upstream package's
# own metadata, confirmed by actually importing the package and hitting this.
addict = "*"
# ui/: the minimal desktop UI that runs the pipeline as a subprocess instead
# of via the CLI by hand. Lives in the same `main` env as everything else so
# it shells out to `pipeline.run` under the exact same interpreter.
PySide6 = ">=6.8"
# Face-capture stage's landmark detector (FaceLandmarker task API, 478 3D
# landmarks). Its own declared dependency is opencv-contrib-python, not
# opencv-python-headless like the rest of this env, confirmed to resolve
# and coexist without a version conflict (pip/uv just installs both dists;
# whichever's cv2/ files land last in site-packages is what actually runs),
# verified with the full existing test suite to rule out a silent regression
# from that swap.
mediapipe = "*"

[feature.main.pypi-dependencies.torch]
version = "==2.8.*"
index = "https://download.pytorch.org/whl/cu128"

[feature.main.pypi-dependencies.torchvision]
version = "==0.23.*"
index = "https://download.pytorch.org/whl/cu128"

# depth-anything-3 hard-pins numpy<2, which forces numpy 1.26.4 (the newest
# 1.x release), and no numpy 1.x release ever shipped a cp313 win-64 wheel
# (confirmed via PyPI's JSON API), so it has to be compiled from source on
# this platform. That source build has proven fragile in CI.
# Overriding it here sidesteps this whole bug class rather than chasing each
# new compiler-specific crash it produces.
[feature.main.pypi-options.dependency-overrides]
numpy = ">=2.1"

[environments.main]
features = ["main"]
no-default-feature = true

# flame-convert: a one-time-use environment, never imported by pipeline code.
# Its only job is scripts/convert_flame_model.py, which turns the officially-
# released FLAME 2020 model (a chumpy-pickled .pkl, chumpy is the original
# authors' own now-unmaintained numpy wrapper library) into a plain .npz that
# `smplx`'s own native FLAME loader reads directly, so chumpy never needs to
# be anywhere near the actual pipeline's `main`/`export` environments. chumpy
# 0.70 itself needs numpy <1.24 (it imports numpy's `bool`/`int` aliases,
# removed in 1.24) and Python <=3.10 (it calls `inspect.getargspec`, removed
# in 3.11) to even import, and its own setup.py does a bare `import pip` at
# build time, incompatible with an isolated build venv, hence both `pip`
# declared as a real conda dependency here (so that `import pip` succeeds)
# and `no-build-isolation` below (so the build runs against this env's own
# site-packages instead of a pip-less throwaway one).
[feature.flame-convert.dependencies]
python = "3.10.*"
numpy = "1.23.*"
pip = "*"
setuptools = "*"
wheel = "*"

[feature.flame-convert.pypi-dependencies]
chumpy = "==0.70"

[feature.flame-convert.pypi-options]
no-build-isolation = ["chumpy"]

[environments.flame-convert]
features = ["flame-convert"]
no-default-feature = true
